[package]
name = "novabar"
version = "0.2.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }

window-vibrancy = "0.6"
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Networking_Connectivity"] }
