<!doctype html><html><head><meta charset="utf-8"><title>NovaBar</title><link rel="stylesheet" href="style.css"></head><body><section id="settings" hidden><button id="add">＋ Add app</button><label><input id="hide" type="checkbox"> Replace taskbar</label><label>Width <input id="width" type="range" min="650" max="1500"></label><label>Opacity <input id="opacity" type="range" min="25" max="100"></label><label>Accent <input id="accent" type="color"></label><label><input id="blur" type="checkbox"> Blur</label><label>Weather city <input id="city" type="text" placeholder="City"></label><button id="weatherSave">Set</button><label>Display <select id="monitor"></select></label><label><input id="autoHide" type="checkbox" checked> Hide in fullscreen</label><button id="customize">Widgets</button><button id="quit">Quit</button></section><section id="launcher" hidden><input id="search" type="search" placeholder="Search installed apps"><div id="results"></div><button id="nativeStart">Windows Start</button></section><section id="custom" hidden><label><input id="startup" type="checkbox"> Start with Windows</label><label>Theme <select id="theme"><option value="glass">Dark Glass</option><option value="midnight">Midnight</option><option value="light">Frost</option></select></label><label>Icons <input id="iconSize" type="range" min="24" max="44"></label><div id="widgetChoices"></div></section><section id="calendar" hidden><strong id="month"></strong><div id="days"></div><button id="closeCalendar">Close</button></section><section id="soundPanel" hidden><button id="volDown">Volume −</button><button id="volMute">Mute</button><button id="volUp">Volume +</button><button id="soundSettings">Sound settings</button><button id="brightness">Display brightness</button><button id="wifiPicker">Wi-Fi networks</button></section><main><button id="start" title="All apps" class="glyph">▦</button><i></i><div id="apps"></div><div id="windows"></div><i></i><div class="media" id="mediaPanel" hidden><img class="art" id="art" alt="" hidden><div class="track"><strong id="song">Nothing playing</strong><small id="artist">Windows media</small></div><button id="previous" title="Previous">⏮</button><button id="toggle" title="Play/pause">▶</button><button id="next" title="Next">⏭</button></div><i></i><div class="stat"><small>CPU</small><strong id="cpu">—</strong></div><div class="stat"><small>RAM</small><strong id="ram">—</strong></div><div class="stat"><small id="netlabel">NETWORK</small><strong id="network">—</strong></div><div class="stat"><small>BATTERY</small><strong id="power">—</strong></div><i></i><div class="stat"><small id="weatherCity">WEATHER</small><strong id="weather">—</strong></div><div class="stat clock" id="clockWidget" role="button" tabindex="0"><strong id="time"></strong><small id="date"></small></div><button id="sound" title="Volume">♪</button><button id="desktops" title="Task view">▣</button><button id="quick" title="Windows quick settings">◉</button><button id="notifications" title="Windows notifications">♧</button><button id="gear" title="Settings" class="glyph">⚙</button></main><script src="renderer.js"></script></body></html>
