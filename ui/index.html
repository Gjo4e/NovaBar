<!doctype html><html><head><meta charset="utf-8"><title>NovaBar</title><link rel="stylesheet" href="style.css"></head><body><section id="settings" hidden><button id="add">＋ Add app</button><label><input id="hide" type="checkbox"> Replace taskbar</label><label>Width <input id="width" type="range" min="650" max="1500"></label><label>Opacity <input id="opacity" type="range" min="25" max="100"></label><label>Accent <input id="accent" type="color"></label><label><input id="blur" type="checkbox"> Blur</label><label>Weather city <input id="city" type="text" placeholder="City"></label><button id="weatherSave">Set</button><button id="quit">Quit</button></section><main><button id="start" title="All apps" class="glyph">▦</button><i></i><div id="apps"></div><i></i><div class="media"><div class="art">♫</div><div class="track"><strong id="song">Nothing playing</strong><small id="artist">Windows media</small></div><button id="previous" title="Previous">⏮</button><button id="toggle" title="Play/pause">▶</button><button id="next" title="Next">⏭</button></div><i></i><div class="stat"><small>CPU</small><strong id="cpu">—</strong></div><div class="stat"><small>RAM</small><strong id="ram">—</strong></div><div class="stat"><small id="netlabel">NETWORK</small><strong id="network">—</strong></div><div class="stat"><small>BATTERY</small><strong id="power">—</strong></div><i></i><div class="stat"><small id="weatherCity">WEATHER</small><strong id="weather">—</strong></div><div class="stat clock"><strong id="time"></strong><small id="date"></small></div><button id="gear" title="Settings" class="glyph">⚙</button></main><script src="renderer.js"></script></body></html>
