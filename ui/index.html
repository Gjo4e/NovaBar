<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaBar</title><link rel="stylesheet" href="style.css"></head><body>
<section id="settings" hidden class="settings-shell"><header class="settings-head"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></svg></div><div class="brand-copy"><strong>NovaBar Settings</strong><small>Customize your dock experience</small></div><button class="close-panel" id="closeSettings" title="Close">×</button></header><div class="settings-content"><nav class="settings-nav"><button class="nav-active" data-page="general">General</button><button data-page="appearance">Appearance</button><button data-page="widgets">Widgets</button><button data-page="behavior">Behavior</button><button data-page="advanced">Advanced</button><button data-page="about">About</button></nav><div class="settings-pages">
<div class="settings-page" data-page="general"><label class="setting-title">Position</label><div class="position-control"><select id="dockPosition"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select><div id="positionButtons"><button data-position="left">Left</button><button data-position="center">Center</button><button data-position="right">Right</button></div></div><label class="setting-title">Opacity <output id="opacityValue">85%</output></label><input id="opacity" type="range" min="25" max="100" value="85"><label class="setting-title">Accent Color</label><div class="swatches" id="swatches"><button data-color="#a976ff" style="--swatch:#a976ff" aria-label="Purple"></button><button data-color="#2196f3" style="--swatch:#2196f3" aria-label="Blue"></button><button data-color="#12d6e8" style="--swatch:#12d6e8" aria-label="Cyan"></button><button data-color="#24d46a" style="--swatch:#24d46a" aria-label="Green"></button><button data-color="#ff9438" style="--swatch:#ff9438" aria-label="Orange"></button><button data-color="#f3488e" style="--swatch:#f3488e" aria-label="Pink"></button></div><input id="accent" type="color" aria-label="Custom accent color"><label class="setting-title">Size <output id="widthValue">100%</output></label><input id="width" type="range" min="650" max="1500" value="1100"></div>
<div class="settings-page" data-page="appearance" hidden><label class="setting-title">Appearance</label><label>Theme <select id="theme"><option value="glass">Dark Glass</option><option value="midnight">Midnight</option><option value="light">Frost</option></select></label><label><input id="blur" type="checkbox"> Glass blur</label><label>Icon size <input id="iconSize" type="range" min="24" max="44"></label></div>
<div class="settings-page" data-page="widgets" hidden><label class="setting-title">Visible widgets</label><div id="widgetChoices"></div><label>Weather city <input id="city" type="text" placeholder="City"></label><button id="weatherSave" class="panel-action">Save city</button></div>
<div class="settings-page" data-page="behavior" hidden><label class="setting-title">Pinned Apps</label><div id="pinnedApps"></div><button id="addPinned" class="panel-action">Pin an application</button><label class="setting-title">Dock behavior</label><label><input id="hide" type="checkbox"> Replace Windows taskbar</label><label><input id="autoHide" type="checkbox" checked> Hide in fullscreen</label><label><input id="startup" type="checkbox"> Start with Windows</label></div>
<div class="settings-page" data-page="advanced" hidden><label class="setting-title">Display</label><label>Monitor <select id="monitor"></select></label><label><input id="bothMonitors" type="checkbox"> Show NovaBar on both monitors</label><button id="soundSettings" class="panel-action">Windows sound settings</button><button id="brightness" class="panel-action">Display brightness</button><button id="wifiPicker" class="panel-action">Wi-Fi networks</button><button id="taskManager" class="panel-action">Task Manager</button><button id="quit" class="panel-action danger">Exit NovaBar</button></div>
<div class="settings-page" data-page="about" hidden><label class="setting-title">Updates</label><div id="updateStatus">Checking GitHub Releases…</div><button id="checkUpdate" class="panel-action">Check for updates</button><button id="installUpdate" class="panel-action" hidden>Download and install update</button><label><input type="checkbox" id="autoUpdateCheck" checked> Check automatically</label><div class="about-mark">NovaBar</div><strong>NovaBar</strong><small>Free Windows 11 desktop dock</small><small>Built with Tauri and Rust</small></div>
</div></div></section>
<section id="appContext" hidden role="menu"><button id="contextOpen">Open / switch to app</button><button id="contextTaskManager">Task Manager</button><button id="contextUnpin">Unpin from NovaBar</button></section><section id="windowChooser" hidden role="menu" aria-label="Open application windows"><div class="chooser-heading">Open windows <button id="chooserTaskManager" title="Open Task Manager">Task Manager</button></div><div id="windowChoices"></div></section><section id="launcher" hidden><input id="search" type="search" placeholder="Search installed applications"><div id="results"></div><button id="nativeStart">Windows Start</button></section>
<section id="custom" hidden><div id="customHelp">Customize widgets in Settings → Widgets</div><button id="customClose">Close</button></section>
<section id="calendar" hidden><strong id="month"></strong><div id="days"></div><button id="closeCalendar">Close</button></section>
<section id="soundPanel" hidden><button id="volDown">Volume −</button><button id="volMute">Mute</button><button id="volUp">Volume +</button><button id="sound">Volume</button></section>
<main><button id="start" class="start-icon" title="All applications"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button><div class="dock-divider"></div><div id="apps"></div><div id="windows"></div><div class="dock-divider"></div>
<div class="media" id="mediaPanel" hidden><img class="art" id="art" alt="" hidden><div class="track"><strong id="song"></strong><small id="artist"></small></div><div class="media-controls"><button id="previous" title="Previous">◀◀</button><button id="toggle" title="Play / pause">▶</button><button id="next" title="Next">▶▶</button></div></div><div class="dock-divider" id="mediaDivider"></div>
<div class="stat" id="cpuStat"><small>CPU</small><strong id="cpu">—</strong></div><div class="stat" id="ramStat"><small>RAM</small><strong id="ram">—</strong></div><div class="stat" id="networkStat"><small id="netlabel">WI-FI</small><strong id="network">—</strong></div><div class="stat" id="batteryStat"><small>BATTERY</small><strong id="power">—</strong></div><div class="stat" id="weatherStat"><small id="weatherCity">WEATHER</small><strong id="weather">—</strong></div>
<div class="dock-divider"></div><div class="clock" id="clockWidget" role="button" tabindex="0"><strong id="time"></strong><small id="date"></small></div><button id="soundOpen" class="system-button" title="Volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a5 5 0 0 1 0 6"/></svg></button><button id="desktops" class="system-button" title="Task view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg></button><button id="quick" class="system-button" title="Quick settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a14 14 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 15a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/></svg></button><button id="notifications" class="system-button" title="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button><button id="gear" class="system-button settings-gear" title="NovaBar Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 14 5l3-1 1 3 3 2-2 3 2 3-3 2-1 3-3-1-2 2-2-2-3 1-1-3-3-2 2-3-2-3 3-2 1-3 3 1Z"/><circle cx="12" cy="12" r="3"/></svg></button></main><script src="renderer.js"></script></body></html>
