name: Build NovaBar Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate installer icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force src-tauri/icons
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(35,39,55))
          $g.DrawString('N',(New-Object System.Drawing.Font 'Segoe UI',18),[System.Drawing.Brushes]::White,2,1)
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $f = [System.IO.File]::Create("$pwd/src-tauri/icons/icon.ico")
          $ico.Save($f)
          $f.Close()
          $g.Dispose()
          $bmp.Dispose()
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: NovaBar-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($files.Count -eq 0) { throw "Installer not found" }
          $checksums = foreach ($f in $files) { "$((Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower())  $($f.Name)" }
          $checksums | Set-Content -Encoding ascii SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" $files.FullName SHA256SUMS.txt --title "NovaBar ${{ github.ref_name }}" --generate-notes
